[project]
name = "alpr-jetson"
version = "0.1.0"
description = "ALPR pipeline orchestration for Jetson (DeepStream, OCR, API)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.119.1",
    "matplotlib>=3.7.5",
    "numpy>=1.24.4",
    "opencv-python>=4.11.0.86",
    "pandas>=2.0.3",
    "pillow>=10.4.0",
    "python-multipart>=0.0.9",
    "pycocotools>=2.0.7",
    "pytest>=8.3.5",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "uvicorn>=0.33.0",
]

[project.scripts]
alpr-jetson = "alpr_jetson.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

# (recommended) make sure packages under src/ are found
[tool.setuptools.packages.find]
where = ["src"]

# ⬇️ replace [tool.uv.scripts] with Poe tasks
[tool.poe.tasks]
guard = "bash tools/py38_guard.sh src"
test = "pytest -q"

[dependency-groups]
dev = [
    "poethepoet>=0.30.0",
]
