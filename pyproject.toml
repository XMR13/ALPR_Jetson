[project]
name = "alpr-jetson"
version = "0.1.0"
description = "ALPR pipeline orchestration for Jetson (DeepStream, OCR, API)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
alpr-jetson = "alpr_jetson.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

